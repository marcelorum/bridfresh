# ============================================================
#  Session Keep-Alive — config (EXAMPLE TEMPLATE)
#  Copia este archivo a config.conf y editalo con tus datos.
#  cp config.example.conf config.conf
#  config.conf NO se sube a git: es tuyo y privado.
# ============================================================

# URLs a ciclar. La sesion se mantiene "viva" rotando entre ellas.
# Mientras mas distintas sean, mas natural parece el comportamiento.
URLS=(
  "https://tu-web.com/dashboard"
  "https://tu-web.com/lista"
  "https://tu-web.com/perfil"
)

# Intervalo en segundos entre cada rotacion.
# 120 = 2 min   |   300 = 5 min   |   240 = 4 min
INTERVAL=120

# Navegadores a controlar (true / false).
# IMPORTANTE: la automatizacion usa la sesion que ya tenes abierta
# en ese navegador; no abre una nueva ni pide login de nuevo.
CHROME=true
SAFARI=true
FIREFOX=true

# Si la URL actual apunta a otra pagina del mismisimo dominio, el
# navegador ya la tiene en cache y el "load" no se percibe como navegacion.
# Podes forzar un comportamiento mas visible con RELOAD_MODE:
#   "navigate" -> solo navega a la URL (default)
#   "force"    -> navega y luego hace reload (Chrome/Safari)
RELOAD_MODE="navigate"