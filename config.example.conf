# Intervalo en segundos entre cada refresco del dashboard.
# 240 = 4 min (default)   |   120 = 2 min   |   300 = 5 min
INTERVAL=240

# Las URLs a ciclar viven AQUI, en este archivo (privado):
# una por linea, en el orden de ciclado, entre URLS=( y ).
# Quita el # de las lineas de ejemplo y pone tus URLs reales.
# Si no hay URLs, el script cae al default embebido.
URLS=(
  # "https://example.com/dashboard"
  # "https://example.com/lista"
)
